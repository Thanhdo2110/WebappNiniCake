# Nginx cho SPA Nini Cakes: yếu tĩnh + proxy API về server:4000
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx phân giải tên `server` MỘT LẦN lúc đọc config rồi giữ IP đó mãi.
    # Chỉ cần tạo lại container API (docker compose up -d server) là IP đổi,
    # nginx vẫn gọi vào IP cũ → mọi request /api trả 502.
    # Truyền địa chỉ qua biến khiến nginx resolve lại theo `valid=` mỗi request.
    # (Cách `upstream { server ... resolve; }` chỉ có ở nginx Plus, bản này không dùng được.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nini_api http://server:4000;

    # Ảnh upload do API phục vụ
    location /uploads/ {
        proxy_pass $nini_api;
        proxy_set_header Host $host;
    }

    # API
    location = /sitemap.xml {
        proxy_pass $nini_api;
    }

    location /api/ {
        proxy_pass $nini_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # Tài sản build (hash dài)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html không được cache: mỗi lần build, asset đổi tên có hash.
    # Trang cũ nằm lại trong bộ nhớ đệm sẽ gọi asset đã bị xoá → 404 → mất style.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
